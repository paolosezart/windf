name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Run self-tests
        run: make test

      - name: Build binaries
        run: make

      - name: Verify PE machine type
        run: |
          set -e
          file dist/df-x64.exe dist/df-x86.exe dist/df.exe
          x86_64-w64-mingw32-objdump -f dist/df-x64.exe | grep -q 'file format pei-x86-64'
          i686-w64-mingw32-objdump   -f dist/df-x86.exe | grep -q 'file format pei-i386'
          i686-w64-mingw32-objdump   -f dist/df.exe     | grep -q 'file format pei-i386'

      - name: Verify universal payload matches the 64-bit build
        run: python3 tools/check_payload.py dist/df.exe dist/df-x64.exe

      - name: Checksums
        run: |
          {
            ( cd dist && sha256sum df.exe df-x64.exe df-x86.exe )
            sha256sum df.bat
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windf-binaries
          path: |
            dist/df.exe
            dist/df-x64.exe
            dist/df-x86.exe
            df.bat
            SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/df.exe
            dist/df-x64.exe
            dist/df-x86.exe
            df.bat
            SHA256SUMS.txt
          body: |
            `df` for Windows, in the style of the Unix `df` command.

            Output is grouped by physical disk, with real free-space numbers.
            The usual coreutils ports report `Avail 0` on NTFS; this one does not.

            Columns: `Volume` (drive letter), `Type` (NTFS/FAT32/exFAT...),
            `Size`, `Used`, `Avail`, `Use%`, `Mounted on`. Each physical disk
            also prints its model and serial number when the drive reports one.

            | File | Architecture | Notes |
            | --- | --- | --- |
            | `df.exe` | 32-bit and 64-bit | one file; run `df.exe --install` |
            | `df-x64.exe` | 64-bit (x86-64) | rename to `df.exe` and put on your `PATH` |
            | `df-x86.exe` | 32-bit (i386) | for 32-bit Windows |
            | `df.bat` | any | single file, embedded PowerShell 2.0 |

            All of them run on Windows Vista and later. No .NET, no Visual C++
            runtime, no extra DLLs — the binaries link only against
            `KERNEL32`, `MPR` and `msvcrt`, which ship with Windows.

            The universal `df.exe` runs on both architectures and can install
            itself. It is a 32-bit image carrying the 64-bit build inside it:

            ```
            df.exe --install     copy the 64-bit build to System32 and the
                                 32-bit build to SysWOW64 (System32 only on
                                 32-bit Windows), asking for admin rights
            df.exe -i            same, short form
            df.exe -i -r         overwrite an existing df
            ```

            Nothing is extracted to a temp folder. The 64-bit code comes
            straight out of a resource inside `df.exe`. Replacing a copy that
            is already running works: the new image is swapped in by rename,
            so there is no need to close `df` first.

            ```
            df             group by physical disk, show filesystem type
            df -h          sizes in powers of 1024 (default)
            df -H          sizes in powers of 1000
            df -k          sizes in 1024-byte blocks
            df -a          include volumes without a drive letter
            df --help      full option list
            ```

            See `SHA256SUMS.txt` to verify your download.

